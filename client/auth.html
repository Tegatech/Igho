<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="assets/igho-icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#08182B">
  <title>Sign in — Igho</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-brand" aria-label="Igho">
      <img src="assets/igho-icon.svg" alt="" class="auth-brand-mark">
      <img src="assets/igho-wordmark.png" alt="Igho" class="auth-brand-wordmark">
    </div>
    <section class="auth-card">
      <div id="authForms">
        <div id="inviteContext" class="invite-context" hidden><span class="invite-eyebrow">The24thGroup invitation</span><strong id="inviteContextName"></strong><small id="inviteContextEmail"></small></div>
        <h1 id="authTitle">Welcome to Igho</h1>
        <p class="sub" id="authSubtitle">Sign in to your payroll workspace.</p>
        <div class="tabs">
          <button class="tab active" type="button" data-mode="signin">Sign in</button>
          <button class="tab" type="button" data-mode="signup">Create account</button>
        </div>
        <form id="signinForm">
          <label>Email<input id="signinEmail" type="email" autocomplete="email" required></label>
          <label>Password<input id="signinPassword" type="password" autocomplete="current-password" required></label>
          <button class="btn" type="submit">Sign in</button>
        </form>
        <form id="signupForm" hidden>
          <label>Name<input id="signupName" autocomplete="name" required></label>
          <label>Email<input id="signupEmail" type="email" autocomplete="email" required></label>
          <label>Password<input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required></label>
          <button class="btn" type="submit">Create account</button>
        </form>
        <div class="message" id="authMessage" role="status"></div>
      </div>
      <div class="signed-in" id="signedIn">
        <h1>Account ready</h1>
        <p class="sub">You’re signed in to Igho.</p>
        <div class="identity"><strong id="identityName"></strong><small id="identityEmail"></small></div>
        <div class="actions">
          <button class="btn gold" id="bootstrapBtn" type="button">Complete workspace setup</button>
          <button class="btn" id="continueBtn" type="button">Continue to Igho</button>
          <button class="btn secondary" id="signoutBtn" type="button">Sign out</button>
        </div>
        <div class="message" id="sessionMessage" role="status"></div>
      </div>
    </section>
    <p class="foot">Igho</p>
  </main>
  <script type="module" src="js/auth-page.js"></script>
</body>
</html>
