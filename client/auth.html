<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="assets/igho-icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#08182B">
  <title>Sign in — Igho</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/typography.css">
  <style>
    :root{--navy:#08182b;--paper:#f5f2ea;--gold:#e5a400;--line:#d9d5cc;--muted:#667085}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--paper);color:var(--navy);display:grid;place-items:center;padding:24px}
    .auth-shell{width:min(100%,440px)}
    .auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
    .auth-brand img{width:34px;height:34px}
    .auth-brand strong{font-size:20px}
    .auth-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px;box-shadow:0 10px 32px rgba(8,24,43,.06)}
    h1{font-size:28px;margin:0 0 8px}
    .sub{color:var(--muted);margin:0 0 24px;line-height:1.5}
    .tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:22px}
    .tab{appearance:none;border:0;background:none;padding:11px;font:inherit;cursor:pointer;color:var(--muted)}
    .tab.active{color:var(--navy);border-bottom:2px solid var(--navy);font-weight:600}
    form{display:grid;gap:14px}
    [hidden]{display:none!important}
    label{display:grid;gap:7px;font-size:13px;font-weight:600}
    input{width:100%;border:1px solid var(--line);border-radius:7px;padding:12px 13px;font:inherit;background:#fff;color:var(--navy)}
    input:focus{outline:2px solid rgba(8,24,43,.2);outline-offset:1px}
    .btn{appearance:none;border:0;border-radius:7px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
    .btn.gold{background:var(--gold);color:var(--navy)}
    .btn.secondary{background:#fff;border:1px solid var(--line);color:var(--navy)}
    .actions{display:grid;gap:10px;margin-top:8px}
    .message{min-height:20px;font-size:13px;margin-top:16px;color:var(--muted)}
    .message.error{color:#a12626}
    .signed-in{display:none}
    .signed-in.visible{display:block}
    .identity{padding:12px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
    .identity strong,.identity small{display:block}
    .identity small{color:var(--muted);margin-top:4px}
    .foot{font-size:12px;color:var(--muted);margin-top:18px;text-align:center}
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="auth-brand"><img src="assets/igho-icon.svg" alt=""><strong>igho</strong></div>
    <section class="auth-card">
      <div id="authForms">
        <h1>Welcome to Igho</h1>
        <p class="sub">Sign in to The24thGroup payroll workspace.</p>
        <div class="tabs">
          <button class="tab active" type="button" data-mode="signin">Sign in</button>
          <button class="tab" type="button" data-mode="signup">Create account</button>
        </div>
        <form id="signinForm">
          <label>Email<input id="signinEmail" type="email" autocomplete="email" required></label>
          <label>Password<input id="signinPassword" type="password" autocomplete="current-password" required></label>
          <button class="btn" type="submit">Sign in</button>
        </form>
        <form id="signupForm" hidden>
          <label>Name<input id="signupName" autocomplete="name" required></label>
          <label>Email<input id="signupEmail" type="email" autocomplete="email" required></label>
          <label>Password<input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required></label>
          <button class="btn" type="submit">Create account</button>
        </form>
        <div class="message" id="authMessage" role="status"></div>
      </div>

      <div class="signed-in" id="signedIn">
        <h1>Account ready</h1>
        <p class="sub">Your Neon Auth session is active.</p>
        <div class="identity"><strong id="identityName"></strong><small id="identityEmail"></small></div>
        <div class="actions">
          <button class="btn gold" id="bootstrapBtn" type="button">Set up The24thGroup workspace</button>
          <button class="btn" id="continueBtn" type="button">Continue to Igho</button>
          <button class="btn secondary" id="signoutBtn" type="button">Sign out</button>
        </div>
        <div class="message" id="sessionMessage" role="status"></div>
      </div>
    </section>
    <p class="foot">Igho Development · Neon Auth + Catalyst API</p>
  </main>
  <script type="module" src="js/auth-page.js"></script>
</body>
</html>
