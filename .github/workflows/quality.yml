name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # Neon Auth UI currently publishes a required workspace:* peer range for
        # @neondatabase/auth. npm's strict peer resolver cannot resolve that
        # published workspace protocol outside Neon's monorepo, so CI ignores
        # peer auto-resolution while we pin both compatible packages explicitly.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run quality gates
        run: npm run quality
