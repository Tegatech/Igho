name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run quality gates
        run: npm run quality

      - name: Upload Catalyst function bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: igho-api-catalyst
          path: |
            functions/igho-api/index.js
            functions/igho-api/package.json
            functions/igho-api/catalyst-config.json
          if-no-files-found: error

      - name: Upload web client
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: igho-web-client
          path: client/
          if-no-files-found: error
