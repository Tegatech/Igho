version: 1

runners:
  Machine:
    config-id: 2

images:
  DeployMachine:
    image: ubuntu
    auth:
      username: << env.USER_NAME >>
      password: << env.USER_PASSWORD >>

jobs:
  Quality_Check:
    steps:
      - apt-get update
      - apt-get install -y curl

      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs

      - node --version
      - npm --version

      - npm install --legacy-peer-deps --no-audit --no-fund
      - npm run quality

  Deploy_Igho:
    steps:
      - apt-get update
      - apt-get install -y curl

      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs

      - npm install --legacy-peer-deps --no-audit --no-fund
      - npm run build

      - npm install -g zcatalyst-cli
      - catalyst -v

      # The function deploy sets its environment variables from the pipeline
      # variables below; a plain `catalyst deploy` would wipe them. It refuses
      # to deploy if any required variable is missing.
      - >-
        DATABASE_URL='<< env.DATABASE_URL >>'
        NEON_AUTH_BASE_URL='<< env.NEON_AUTH_BASE_URL >>'
        BOOTSTRAP_OWNER_EMAIL='<< env.BOOTSTRAP_OWNER_EMAIL >>'
        IGHO_PUBLIC_ORIGIN='<< env.IGHO_PUBLIC_ORIGIN >>'
        PROJECT_ID='<< env.PROJECT_ID >>'
        CATALYST_ORG='<< env.CATALYST_ORG >>'
        node infrastructure/scripts/deploy-function.mjs
        --token << env.CATALYST_TOKEN >>

      - >-
        catalyst deploy
        --only client
        --project << env.PROJECT_ID >>
        --org << env.CATALYST_ORG >>
        --token << env.CATALYST_TOKEN >>

stages:
  - name: quality
    image: DeployMachine
    jobs:
      - Quality_Check

  - name: deploy
    image: DeployMachine
    jobs:
      - Deploy_Igho